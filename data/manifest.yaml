# AyuPramana corpus manifest — one entry per document in data/raw/.
#
# The assistant only knows what is listed here AND present on disk.
# Add an entry, drop the file in data/raw/<jurisdiction>/, then run (from backend/):
#     python scripts/ingest.py --all
#
# Fields
#   id            unique snake_case id (never reuse or rename once ingested)
#   title         official title, exactly as printed on the document
#   jurisdiction  india | international
#   domain        ip | abs | drug_regulation | advertising | food | cosmetics | tk
#   doc_type      statute | rules | treaty | guideline | registry_note
#   version_date  "YYYY-MM-DD" — the date of the text you downloaded (from the document itself)
#   source_url    the exact official URL the file was downloaded from
#   file          path relative to data/raw/
#   section_label optional: what bare numbered headings are called (default by doc_type)
#
# Every title and version_date below was read from the downloaded document itself
# (India Code prints "As on <date>" on page 1). See docs/CORPUS_SOURCES.md for documents still to add.

