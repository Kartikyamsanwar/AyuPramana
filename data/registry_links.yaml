# Curated official portals used by the Registry navigator and the TKDL / prior-art pointer.
#
# The assistant NEVER invents links. It shows an entry to users only when `verified: true`.
# To verify an entry: open the official site, find the exact page (filing, search or form page),
# paste that URL into `url`, add what users will find there to `note`, then set `verified: true`.
#
# Fields
#   id            unique snake_case id
#   name          what users see
#   jurisdiction  india | international
#   topics        which goals this link serves (see vocabulary below)
#   url           exact official URL (leave "" until checked)
#   note          optional one-line description (e.g. which form or search)
#   verified      true only after a team member has checked the link
#
# Topic vocabulary: patent, trademark, design, gi, copyright, plant_variety, abs, tk,
#                   prior_art_search, drug_licence, food, cosmetics, statutes
#
# The three root domains below are listed in the SIH26045 problem statement's dataset section.
# They still need a team member to confirm the exact page before setting verified: true.

- id: ip_india
  name: "IP India (Office of the Controller General of Patents, Designs & Trade Marks)"
  jurisdiction: india
  topics: [patent, trademark, design, gi, prior_art_search]
  url: "https://ipindia.gov.in"
  note: ""
  verified: false

